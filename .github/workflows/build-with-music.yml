name: Build Storm Serpent
on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    # Give the workflow permission to read other repos in the Org
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Checkout music assets
        uses: actions/checkout@v6
        with:
          repository: StormSerpent/storm-serpent-music
          token: ${{ secrets.MUSIC_PAT }}
          path: music-assets

      - name: Copy music assets into src/main/resources/
        run: cp -R music-assets/* src/main/resources/

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Build with Gradle
        run: ./gradlew build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: StormSerpent
          path: build/libs
